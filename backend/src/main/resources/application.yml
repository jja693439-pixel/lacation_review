spring:
  application:
    name: backend

  # 프로젝트 루트의 .env 파일을 설정으로 읽는다 (없어도 무시).
  # ./.env 는 루트에서 실행할 때, ../.env 는 backend/ 에서 실행할 때(gradlew bootRun) 쓰인다.
  # 같은 이름의 OS 환경변수가 있으면 그 값이 .env 보다 우선한다.
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/place_review}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
