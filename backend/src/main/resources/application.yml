spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/place_review
    username: postgres
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
